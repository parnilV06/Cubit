    <script>
      // Polyfill global $ required by cstimer_module in browser ESM environments
      if (typeof window !== 'undefined') {
        window.$ = window.$ || {
          isArray: Array.isArray,
          noop: function() {},
          now: function() { return +new Date(); }
        };
      }
    </script>
